[package]
name = "chantedit"
version = "0.2.0"
edition = "2024"
description = "Add guitar chord symbols above chant scores"
license = "GPL-3.0-or-later"
default-run = "chantedit"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
async-channel = "2.5"
cairo = { package = "cairo-rs", version = "0.22", features = ["pdf", "png"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
pangocairo = "0.22"
poppler = { package = "poppler-rs", version = "0.26", features = ["v0_82"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 4

# Detection runs on every page; keep it fast in debug builds too.
[profile.dev.package.chantedit]
opt-level = 1
