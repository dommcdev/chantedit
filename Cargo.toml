[package]
name = "chantedit"
version = "0.3.0"
edition = "2024"
description = "Add guitar chord symbols above chant scores"
license = "GPL-3.0-or-later"
default-run = "chantedit"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
cairo = { package = "cairo-rs", version = "0.22", features = ["png"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
pangocairo = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rquickjs = "0.11"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 4

# Keep the embedded renderer and chord layout responsive in debug builds.
[profile.dev.package.chantedit]
opt-level = 1
